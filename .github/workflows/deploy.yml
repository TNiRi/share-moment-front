name: Deploy API

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend with env vars
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/tniri/share-moment-front:${{ github.ref_name }}
          build-args: |
            VUE_APP_MAPLIBRE_APIKEY=${{ secrets.VUE_APP_MAPLIBRE_APIKEY }}
            VUE_APP_API_URL=${{ secrets.VUE_APP_API_URL }}
            VUE_APP_MODE=production

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/share-moment-infra

            sed -i 's/^SPA_VERSION=.*/SPA_VERSION=${{ github.ref_name }}/' .env

            docker compose pull spa
            docker compose up -d spa